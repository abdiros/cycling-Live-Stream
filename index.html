<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="eVXYBl1iUH4gV0L7UUvDOT_9DrkDN5t4oRfJDMhaa6Q" />
    <title>Cycling Live Stream</title>
    <meta name="description" content="Modern live streaming platform for cycling races with interactive stage profiles, live fan chat, and SEO optimization guides." />
    <meta name="keywords" content="cycling live stream, cyclinglivestream, watch cycling live free, pro cycling streaming, tour de france live stream, cycling tv online" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.cyclinglivestream.com/" id="canonical-link" />

    <!-- Favicons -->
    <link rel="icon" href="{{FAVICON_ICO_URL}}" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{FAVICON_32_URL}}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{APPLE_TOUCH_ICON_URL}}" />

    <!-- Open Graph / Facebook -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.cyclinglivestream.com/" />
    <meta property="og:title" content="Cycling Live Stream" />
    <meta property="og:description" content="Modern live streaming platform for cycling races with interactive stage profiles, live fan chat, and SEO optimization guides." />
    <meta property="og:image" content="{{OG_IMAGE_URL}}" />
    <meta property="og:site_name" content="Cycling Live Stream" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cycling Live Stream" />
    <meta name="twitter:description" content="Modern live streaming platform for cycling races with interactive stage profiles, live fan chat, and SEO optimization guides." />
    <meta name="twitter:image" content="{{OG_IMAGE_URL}}" />
    <meta name="twitter:url" content="https://www.cyclinglivestream.com/" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Cycling Live Stream",
        "alternateName": "cyclinglivestream.com",
        "url": "https://www.cyclinglivestream.com/",
        "description": "Modern live streaming platform for cycling races with interactive stage profiles, live fan chat, and SEO optimization guides.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.cyclinglivestream.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Cycling Live Stream",
        "url": "https://cyclinglivestream.com/",
        "description": "Free live cycling video & HD race streaming",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Web",
        "brand": {
          "@type": "Brand",
          "name": "cycling"
        },
        "publisher": {
          "@type": "Organization",
          "name": "cycling",
          "url": "https://cyclinglivestream.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://cyclinglivestream.com/logo.png"
          }
        },
        "logo": "https://cyclinglivestream.com/logo.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
